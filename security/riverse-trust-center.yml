note: >-
  There is no trust.rainbowstandard.io and no vendor-style trust portal (NXDOMAIN — probed).
  What Rainbow (formerly Riverse) publishes instead is an Administrative Oversight Record: a
  dated, linked archive of Standard Advisory Board meeting decisions, Annual Activity Reports,
  a mission audit statement, and — the part that matters for a registry — its twice-yearly
  Registry Internal IT Audit reports, most recently 2026-07-20. The Procedures Manual commits
  to that cadence in writing ("at least twice per calendar year ... summarize the findings in a
  report made publicly available"), and the record shows the commitment being met. That is the
  trust surface, and it is why the TrustCenter pointer is emitted.
certifications:
