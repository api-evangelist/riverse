note: >-
  IMPORTANT — this is NOT an API changelog. Rainbow (formerly Riverse) publishes no API, so
  there is no release note stream for software. What Rainbow does publish, and publish well,
  is a dated, structured version history for its two normative documents (the Rainbow
  Standard Rules and the Procedures Manual) plus every methodology, with superseded versions
  archived. That is the change surface a consumer of this registry actually depends on, and
  it is captured here. A second, editorial change stream (company + platform announcements)
  runs at https://rainbowstandard.io/updates and is captured under editorial_entries.
versioning:
  scheme: major.minor integer on the document name (e.g. Rainbow Standard Rules V7.1 -> V7.2)
  major_revisions: >-
    Tracked by the first integer. Three phases — Feedback Collection, Draft Preparation,
    Approval — including a mandatory public consultation and Standard Advisory Board review.
  minor_revisions: >-
    Tracked by the second integer. Made by the Rainbow Science Team when they do not result
    in widespread material changes affecting project eligibility.
  docs: https://docs.rainbowstandard.io/rainbow-standard-documents/procedures-manual/standard-and-methodologies
