  docs: https://docs.rainbowstandard.io/rainbow-standard-documents/procedures-manual/standard-and-methodologies
  revision_cadence: >-
    Methodologies are evaluated against the discontinuation criteria at least once every
    three years during the mandatory major revision process, and may be reviewed at any time.
  public_consultation_required: true
  governing_body: Standard Advisory Board (SAB)
deprecation:
  policy_url: https://docs.rainbowstandard.io/rainbow-standard-documents/procedures-manual/standard-and-methodologies
  archive_url: https://docs.rainbowstandard.io/other/archived-methodologies
  sunset_header: false
  policy: >-
    A methodology may be discontinued where it consistently overestimates credits and cannot
    be revised to ensure conservativeness. Projects already validated under a discontinued
    methodology may continue using it until their next verification; after that they must
    transition to a new methodology or become ineligible for new RCCs. Previously issued RCCs
    remain valid and tradable.
  supersession: >-
    Superseded versions of the Standard Rules, the Procedures Manual and every methodology are
    archived at the Archived documents pages "for continuity, transparency, and traceability",
    and every change is recorded in the corresponding Version history page.
  project_compliance: https://docs.rainbowstandard.io/rainbow-standard-documents/procedures-manual/project-certification-procedure
