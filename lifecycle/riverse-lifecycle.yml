note: >-
  Rainbow (formerly Riverse) publishes no API, so there is no API version/deprecation
  policy to capture. It does publish a genuinely rigorous lifecycle policy for the
  artifacts its market depends on — the Standard Rules, the Procedures Manual, and each
  methodology — including a written discontinuation procedure with an explicit transition
  window for already-validated projects. That is the deprecation contract captured here,
  and the Deprecation pointer in apis.yml points at it. There is NO status page anywhere on
  the estate (status.rainbowstandard.io does not resolve), so NO StatusPage pointer is
  emitted, and no SLA or uptime target is published.
