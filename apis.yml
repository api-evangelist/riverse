name: Rainbow
x-former-name: Riverse
description: >-
  Rainbow — formerly Riverse, whose riverse.io domain now 301s to rainbowstandard.io
  — is a carbon crediting programme and registry that certifies and issues Rainbow Carbon
  Credits (RCCs) from engineered carbon removal and greenhouse-gas reduction projects across
  biochar, BiCRS/BioCCS, enhanced rock weathering, ex-situ mineralization, biogas from anaerobic
  digestion, biobased construction materials, battery second life and electronics refurbishment.
  The programme is ICVCM Core-Carbon-Principles approved, ICROA endorsed, approved as a Frontier
  credit issuer, and runs EU CRCF-compliant plus CORSIA and Paris Agreement Article 6 crediting
  tracks. It operates two platforms: Arc (arc.rainbowstandard.io), the project-developer
  certification and MRV platform launched October 2025, and the public Rainbow Registry
  (registry.rainbowstandard.io) where every project, credit block, serial number and retirement
  is published. Its public surface is a 163-page GitBook documentation hub of standard rules,
  procedures, methodologies, fees and governance policies, served with a real llms.txt and a
  Content-Signal AI-usage declaration. No OpenAPI, AsyncAPI, GraphQL SDL, SDK, MCP server or
  A2A agent card is served on any Rainbow host; the only public acknowledgement that an API
  exists at all is a single line in the published fee schedule confirming that API connections
  carry no additional cost.
