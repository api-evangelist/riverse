description: Riverse (linked property rainbowstandard.io / Rainbow Standard) is a carbon credit
  certification platform and registry that issues high-integrity carbon credits from carbon
  removal and greenhouse-gas reduction projects. Its methodologies span biogas, biomass, battery
  recycling, and other engineered decarbonization pathways, with credits approved under ICVCM
  Core Carbon Principles and endorsed by ICROA. The public surface is a policy, methodology, and
  procedure documentation site for project developers; no public developer API, OpenAPI
  specification, SDK, or webhook surface was found during enrichment.
