source: https://docs.rainbowstandard.io/other/terms-and-contracts/rainbow-standard-and-registry-fees
currency: EUR
model: subscription + per-credit issuance fee
note: >-
  Rainbow (formerly Riverse) publishes its complete fee schedule for carbon credit
  certification openly in its GitBook documentation. There are no software/API plans —
  pricing is a platform subscription paid by the Project Developer plus a per-credit
  issuance fee that steps down by cumulative annual volume. Captured verbatim from the
  published Fees page. Notably the same page states "Rainbow does not charge additional
  costs for retirement, transfers or API connections", which is the only place on
  Rainbow's public surface that acknowledges an API connection exists — it is not
  documented anywhere publicly (see x-coverage in apis.yml).
plan_count: 4
plans:
- name: Pre-validation (optional)
  audience: Project Developer
  applies_to: Removal — Category A methodologies
  price: 5000
  currency: EUR
  period: year
  unit: per project per year
  note: Not available for Avoidance — Category B.
- name: Platform subscription — Removal (Category A)
  audience: Project Developer
  applies_to: BiCRS, Mineralization of alkaline materials (ex-situ), Enhanced Rock Weathering, Distributed open/closed-kiln biochar
  price: 5000
  currency: EUR
  period: year
  included: 1 carbon project with 1 site
  overage: 500–2500 EUR per additional site within a project, depending on the number of sites
  includes: [validation audit (remote site audit)]
  note: >-
    On-site visit audits are paid directly to the third-party VVB, typically 1,000–5,000
    EUR depending on location. Verification billed separately (see verification_fees).
- name: Platform subscription — Avoidance (Category B)
  audience: Project Developer
  applies_to: Biobased construction materials, Biogas from anaerobic digestion, Refurbishing of electronic devices, Battery second life
  price: 7500
  currency: EUR
  period: year
  included: 1 carbon project with 1 site
  overage: 2500 EUR per additional site within a project
  includes: [validation audit (remote site audit)]
  verification: 2500 EUR per year per verification per site
- name: Credit issuance fee (Rainbow Carbon Credit / RCC)
  audience: Project Developer
  price_model: per-credit tiered by cumulative volume transferred over trailing 12 months
  currency: EUR
  note: Applied separately for each credit type a project issues.
